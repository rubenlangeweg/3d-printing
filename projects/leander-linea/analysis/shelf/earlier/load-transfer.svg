<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 630" role="img" aria-labelledby="title desc">
<title id="title">How the load reaches the table</title>
<desc id="desc">Nominal 13 mm snug rail side section. A downward load acts 130 mm from the rail datum. The top seat and opposing clip faces press on the wood; the resulting force and turning moment pass into the frame and legs. Diagram does not predict table deformation.</desc>
