<path d="M213.5670771464534,245.79621532184137 L310,344 L394,344" fill="none" stroke="#697b7c" stroke-width="1"/>
<text x="313" y="368" font-size="14">Backplate bearing</text>
<text x="45" y="453" font-size="14" fill="#617073">Wood pushes on the three contact faces.</text>
<text x="45" y="475" font-size="14" fill="#617073">The bracket pushes back equally on the wood.</text>
<text x="45" y="497" font-size="13" fill="#617073">Arrow positions: 2 mm snug-contact model, 2 kg + shelf weight.</text>
<line x1="756" y1="91" x2="756" y2="499" stroke="#d6dfd8"/>
<text x="785" y="122" font-size="15" fill="#617073">ADDED LOAD AT THE RAIL</text>
<text x="785" y="162" font-size="28" font-weight="600">19.61 N down</text>
<text x="785" y="202" font-size="28" font-weight="600">2.55 N·m turning</text>
<text x="785" y="235" font-size="14" fill="#617073">A corner load also adds</text>
<text x="785" y="258" font-size="19">1.27 N·m across the width.</text>
<text x="785" y="321" font-size="15" fill="#617073">INCLUDING THE SOLID SHELF</text>
<text x="785" y="357" font-size="24">23.36 N · 2.69 N·m</text>
<text x="785" y="384" font-size="14" fill="#617073">Shelf mass ≈ 382 g at PLA density.</text>
<text x="785" y="440" font-size="14" fill="#617073">Moving the object closer to the rail</text>
<text x="785" y="462" font-size="14" fill="#617073">reduces the turning moment.</text>
<rect x="34" y="530" width="1052" height="63" rx="10" fill="#e5ebe4"/>
<text x="58" y="558" font-size="17" font-weight="600">Shelf → ribs and clip → wooden rail → frame and legs → floor</text>
<text x="58" y="581" font-size="13" fill="#617073">Load path shown; table bending, joints, floor reactions and tipping are not simulated.</text>
